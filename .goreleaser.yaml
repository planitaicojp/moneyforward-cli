version: 2

builds:
  - binary: mf
    ldflags:
      - -s -w -X github.com/planitaicojp/moneyforward-cli/cmd.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

brews:
  - repository:
      owner: planitaicojp
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    name: mf
    homepage: "https://planitaicojp.github.io/moneyforward-cli-pages/"
    description: "CLI tool for Money Forward Cloud APIs"
    license: "Apache-2.0"
    install: |
      bin.install "mf"
    test: |
      system "#{bin}/mf", "version"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
